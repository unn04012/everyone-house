services:
  postgres:
    image: postgres:17-alpine
    container_name: everyone-house-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: everyone_house
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d everyone_house']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
